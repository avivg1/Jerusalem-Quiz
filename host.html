<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מסך מנחה · מיליון על ירושלים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--night:#0B1030;--stone:#EFE2C4;--dim:#B9AC92;--gold:#E3A72C;--gold2:#F2C766;--olive:#6E8C56;}
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:'Heebo',system-ui,Arial,sans-serif;color:var(--stone);
    background:radial-gradient(120% 70% at 50% -10%,#2A3378 0,rgba(42,51,120,0) 60%),linear-gradient(180deg,#0B1030,#070B22);
    min-height:100vh;padding:24px;display:flex;flex-direction:column;
  }
  h1,h2,.qtext,.big{font-family:'Frank Ruhl Libre',Georgia,serif;font-weight:700;margin:0}
  button{font-family:inherit;cursor:pointer}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex:none}
  .brand{font-size:clamp(18px,2.2vw,26px);color:var(--gold2)}
  .meta{font-size:clamp(14px,1.6vw,20px);color:var(--dim)}
  .btn{border:none;border-radius:14px;padding:16px 30px;font-size:clamp(16px,1.8vw,22px);font-weight:700;
       color:#1A1204;background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 6px 0 #9A6F14}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #9A6F14}
  .btn.ghost{background:transparent;color:var(--dim);border:1px solid rgba(239,226,196,.3);box-shadow:none;font-weight:400;padding:12px 20px;font-size:16px}
  .btn[disabled]{opacity:.35;pointer-events:none}
  .stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px}
  .screen{display:none}.screen.on{display:flex;flex-direction:column;gap:22px;flex:1;justify-content:center}

  /* lobby */
  .lobby{text-align:center}
  .lobby h1{font-size:clamp(34px,6vw,72px);line-height:1.05}
  .joinbox{display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;margin-top:22px}
  .qr{background:#fff;padding:12px;border-radius:14px;line-height:0}
  .url{font-size:clamp(18px,2.6vw,34px);color:var(--gold2);word-break:break-all;max-width:640px;direction:ltr}
  .hint{font-size:clamp(14px,1.5vw,18px);color:var(--dim);margin-top:10px}
  .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:24px;min-height:44px}
  .chip{background:rgba(227,167,44,.16);border:1px solid rgba(227,167,44,.5);border-radius:999px;
        padding:8px 16px;font-size:clamp(14px,1.6vw,20px);animation:pop .3s ease both}
  @keyframes pop{from{opacity:0;transform:scale(.8)}}
  .chip.off{opacity:.35;border-style:dashed}
  .board li.off{opacity:.45}
  .board .off-tag{flex:none;font-size:.6em;color:var(--dim);border:1px solid rgba(239,226,196,.3);
                  border-radius:999px;padding:3px 10px}
  .count{font-size:clamp(16px,2vw,24px);color:var(--dim);margin-top:14px}

  /* question */
  .qtext{font-size:clamp(26px,4.4vw,56px);line-height:1.3;text-align:center;color:#fff}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
  .opt{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,rgba(34,43,107,.9),rgba(21,28,74,.9));
       border:2px solid rgba(239,226,196,.22);border-radius:16px;padding:18px 20px;font-size:clamp(18px,2.4vw,30px);
       transition:all .3s ease;position:relative;overflow:hidden}
  .opt .tag{flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-weight:700;
            background:rgba(227,167,44,.16);color:var(--gold2);border:1px solid rgba(227,167,44,.45);font-size:22px}
  .opt .t{flex:1}
  .opt .n{flex:none;font-size:clamp(16px,2vw,26px);color:var(--gold2);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .3s}
  .opts.revealed .opt .n{opacity:1}
  .opt .fill{position:absolute;inset-inline-start:0;top:0;bottom:0;background:rgba(227,167,44,.14);width:0;transition:width .5s ease;z-index:-1}
  .opt.right{border-color:#78C88F;background:linear-gradient(180deg,#2E6B45,#1F4A30);color:#EAFBEF}
  .opt.right .tag{background:#78C88F;color:#0C2416;border-color:#78C88F}
  .opt.dim{opacity:.4}

  .timerbig{text-align:center;margin:2px 0 4px}
  .timerbig .tnum{font-family:'Frank Ruhl Libre',Georgia,serif;font-size:clamp(50px,8.5vw,104px);line-height:1;
                  color:var(--gold2);font-variant-numeric:tabular-nums;transition:color .3s}
  .timerbig .tlbl{font-size:clamp(13px,1.4vw,18px);color:var(--dim);letter-spacing:3px}
  .timerbig.warn .tnum{color:#FFB4A0}
  .setrow{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin-top:26px}
  .setrow label{display:flex;flex-direction:column;gap:7px;font-size:clamp(13px,1.4vw,17px);color:var(--dim)}
  .setrow select{background:rgba(11,16,48,.9);color:var(--stone);border:1px solid rgba(239,226,196,.3);
                 border-radius:10px;padding:11px 16px;font-size:clamp(16px,1.8vw,20px);font-family:inherit}
  .track{height:12px;background:rgba(239,226,196,.12);border-radius:99px;overflow:hidden}
  .track i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));width:100%;transition:width 1s linear}
  .track.warn i{background:linear-gradient(90deg,#C0392B,#E0748A)}
  .status{display:flex;justify-content:space-between;align-items:center;font-size:clamp(16px,2vw,24px);color:var(--dim)}
  .status b{color:var(--gold2);font-size:1.2em}

  /* board */
  .board{list-style:none;margin:0;padding:0;max-width:760px;margin-inline:auto;width:100%}
  .board li{display:flex;align-items:center;gap:14px;padding:12px 10px;border-bottom:1px solid rgba(239,226,196,.12);
            font-size:clamp(17px,2.2vw,28px);animation:rowin .35s ease both}
  @keyframes rowin{from{opacity:0;transform:translateY(8px)}}
  .board .r{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:.7em;font-weight:700;
            background:rgba(239,226,196,.1);border:1px solid rgba(239,226,196,.18);color:var(--dim)}
  .board .r.m1{background:linear-gradient(160deg,#FFD976,#D69A17);color:#3A2705;border-color:#FFE8AC}
  .board .r.m2{background:linear-gradient(160deg,#E4E8EE,#A7B0BD);color:#2A2F38}
  .board .r.m3{background:linear-gradient(160deg,#E0A178,#B06A3C);color:#33190A}
  .board .nm{flex:1}
  .board .pt{flex:none;color:var(--gold2);font-weight:700;font-variant-numeric:tabular-nums}
  .board .gain{flex:none;font-size:.7em;color:#9FD6AE;min-width:70px;text-align:left}

  .controls{display:flex;gap:12px;justify-content:center;flex:none;padding-top:8px;flex-wrap:wrap}
  .err{color:#FFB4A0;font-size:16px;text-align:center}
  @media (max-width:760px){.opts{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="bar">
  <div class="brand">מיליון על ירושלים · מסך מנחה</div>
  <div class="meta" id="meta"></div>
</div>

<div class="stage">

  <section id="s-lobby" class="screen on lobby">
    <h1>הצטרפו למשחק</h1>
    <div class="joinbox">
      <div class="qr" id="qr"></div>
      <div>
        <div class="url" id="joinurl">—</div>
        <div class="hint">סרקו את הקוד או הקלידו את הכתובת בדפדפן</div>
      </div>
    </div>
    <div class="setrow">
      <label>מספר שאלות
        <select id="setRound"><option>10</option><option selected>15</option><option>20</option><option>25</option></select>
      </label>
      <label>שניות לשאלה
        <select id="setSecs"><option>15</option><option>20</option><option selected>25</option><option>30</option><option>45</option></select>
      </label>
    </div>
    <div class="chips" id="chips"></div>
    <div class="count" id="lcount">מחכים לשחקנים…</div>
  </section>

  <section id="s-q" class="screen">
    <p class="qtext" id="qtext"></p>
    <div class="timerbig" id="timerbig"><div class="tnum" id="tnum">25</div><div class="tlbl">שניות</div></div>
    <div class="opts" id="opts"></div>
    <div class="track" id="track"><i id="trackbar"></i></div>
    <div class="status">
      <span>שאלה <b id="qi">1</b> מתוך <span id="qn">15</span></span>
      <span>ענו: <b id="answered">0</b> / <span id="ptotal">0</span></span>
    </div>
  </section>

  <section id="s-board" class="screen">
    <h2 style="text-align:center;font-size:clamp(24px,3.4vw,42px);color:var(--gold2)" id="btitle">הניקוד עד כה</h2>
    <ul class="board" id="board"></ul>
  </section>

</div>

<div class="controls" id="controls"></div>
<p class="err" id="err"></p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
"use strict";

/* ===== הגדרות ===== */
var LIVE_URL   = "https://quiz-live.avivg1.workers.dev";   // כתובת ה-Worker של מצב מנחה
var PLAYER_URL = "";   // כתובת עמוד השחקן, למשל https://jerusalem-quiz.pages.dev/play.html
var ROUND      = 15;   // כמה שאלות בסיבוב
var SECONDS    = 25;   // שניות לשאלה

  var BANK = {
    easy: [
      /* ★ */ { q: "מי בנה את בית המקדש הראשון?", a: ["דוד המלך", "שלמה המלך", "הורדוס", "עזרא הסופר"], c: 1 },
      /* ★ */ { q: "מי טבע את המשפט ההיסטורי ״הר הבית בידינו״?", a: ["יצחק רבין", "מוטה גור", "עוזי נרקיס", "משה דיין"], c: 1 },
      /* ★ */ { q: "לפי חוק עירוני, באיזה חומר חייבים לצפות כל בניין חדש בירושלים?", a: ["בטון חשוף", "אבן ירושלמית", "לבנים אדומות", "שיש לבן"], c: 1 },
      /* ★ */ { q: "מה שמו של ראש העיר הנוכחי של ירושלים?", a: ["ניר ברקת", "משה ליאון", "אורי לופוליאנסקי", "עופר ברקוביץ׳"], c: 1 },
      /* ★ */ { q: "מה שמו של נשיא המדינה כיום?", a: ["ראובן ריבלין", "יצחק הרצוג", "שמעון פרס", "אפרים קציר"], c: 1 },
      { q: "לכמה רבעים מחולקת העיר העתיקה בירושלים?", a: ["שניים", "שלושה", "ארבעה", "שישה"], c: 2 },
      { q: "מי בנה את חומות העיר העתיקה העומדות על תילן עד היום?", a: ["הורדוס", "סולימאן המפואר", "דוד המלך", "הצלבנים"], c: 1 },
      { q: "איך נקרא השוק הגדול במרכז ירושלים?", a: ["שוק הכרמל", "מחנה יהודה", "שוק תלפיות", "שוק הפשפשים"], c: 1 },
      { q: "איזה הר משקיף על העיר העתיקה ממזרח?", a: ["הר הרצל", "הר הצופים", "הר הזיתים", "הר גילֹה"], c: 2 },
      { q: "מה שמו של הגשר בכניסה לעיר שתכנן סנטיאגו קלטרווה?", a: ["גשר המיתרים", "גשר הקשת", "גשר הצופים", "גשר יפו"], c: 0 },
      { q: "מי המלך שהפך את ירושלים לבירת ממלכת ישראל?", a: ["שאול", "דוד", "שלמה", "חזקיהו"], c: 1 },
      { q: "באיזה חג של חודש תשרי עלו לרגל לירושלים?", a: ["פסח", "שבועות", "סוכות", "חנוכה"], c: 2 },
      { q: "איזו מצודה ניצבת בעיר העתיקה סמוך לשער יפו?", a: ["מגדל דוד", "מגדל שלום", "מצודת אנטוניה", "מגדל הפעמון"], c: 0 },
      { q: "מהו המקום הקדוש ביותר שבו מתפללים יהודים בירושלים?", a: ["הר הרצל", "הכותל המערבי", "קבר רחל", "הר הצופים"], c: 1 },
      { q: "מה שמה של מערכת התחבורה המסילתית שנפתחה בירושלים ב־2011?", a: ["הרכבת הקלה", "המטרו", "הרכבת התחתית", "הרכבת הכבדה"], c: 0 },
      { q: "מה שמו של אתר ההנצחה הלאומי לשואה, הנמצא בירושלים?", a: ["בית התפוצות", "יד ושם", "מוזיאון הכנסת", "היכל הזיכרון"], c: 1 },
      { q: "מהו המוזיאון הלאומי הגדול של ישראל, השוכן בירושלים?", a: ["מוזיאון תל אביב", "מוזיאון ישראל", "מוזיאון המדע", "מגדל דוד"], c: 1 },
      { q: "היכן יושבת הכנסת?", a: ["בגבעת רם, ירושלים", "ברמת גן", "בהר הצופים", "בעיר העתיקה"], c: 0 },
      { q: "מה שמו של המדרחוב המרכזי והוותיק במרכז ירושלים?", a: ["רחוב הרצל", "רחוב בן יהודה", "רחוב אגריפס", "רחוב הנביאים"], c: 1 },
      { q: "מה שמו של בית החולים בירושלים המפורסם בחלונות הוויטראז׳ של שאגאל?", a: ["שערי צדק", "הדסה עין כרם", "ביקור חולים", "אלישע"], c: 1 },
      { q: "באיזה כלי תוקעים בראש השנה?", a: ["חצוצרה", "שופר", "חליל", "תוף"], c: 1 },
      { q: "מהו היום הקדוש ביותר בלוח השנה היהודי?", a: ["ראש השנה", "יום הכיפורים", "שמחת תורה", "ט״ו בשבט"], c: 1 },
      { q: "כמה ימים נמשך חג הסוכות בארץ ישראל?", a: ["שלושה", "חמישה", "שבעה", "תשעה"], c: 2 },
      { q: "כמה מינים כוללת מצוות ארבעת המינים?", a: ["שניים", "שלושה", "ארבעה", "חמישה"], c: 2 },
      { q: "איזה חג חותם את חג הסוכות?", a: ["פורים", "שמחת תורה", "חנוכה", "ל״ג בעומר"], c: 1 },
      { q: "על שם מי נקרא אצטדיון הכדורגל הגדול בירושלים?", a: ["טדי קולק", "יצחק רבין", "תיאודור הרצל", "דוד בן־גוריון"], c: 0 },
      { q: "מה שמה של האקדמיה לאמנות ועיצוב בירושלים?", a: ["שנקר", "בצלאל", "ויצו", "מנשר"], c: 1 },
      { q: "באיזה רחוב שוכן שוק מחנה יהודה?", a: ["רחוב יפו", "רחוב אגריפס", "רחוב המלך ג׳ורג׳", "רחוב הנביאים"], c: 1 },
      { q: "באיזה רחוב בירושלים נמצאת מעון ראש הממשלה?", a: ["בלפור", "רוטשילד", "קפלן", "הרצל"], c: 0 },
      { q: "איזה מלון היסטורי בירושלים פוצץ בשנת 1946?", a: ["מלון המלך דוד", "מלון ימק״א", "מלון אמריקן קולוני", "מלון פאלאס"], c: 0 },
      { q: "איזה עץ מופיע בסמל עיריית ירושלים ומסמל שלום?", a: ["ארז", "זית", "תמר", "שקד"], c: 1 },
      { q: "מה שמו של הגן הלאומי שבו נחשפה ירושלים הקדומה, מדרום לחומות?", a: ["גן סאקר", "עיר דוד", "גן העצמאות", "פארק המסילה"], c: 1 },
      { q: "מה שמו של הפארק שנבנה על מסילת הרכבת הישנה של ירושלים?", a: ["פארק המסילה", "גן הפעמון", "פארק הצפורים", "גן הוורדים"], c: 0 },
      { q: "מה שמו של הקמפוס השני של האוניברסיטה העברית, במערב העיר?", a: ["גבעת רם", "הר הצופים", "עין כרם", "מלחה"], c: 0 },
      { q: "מי כתב את השיר ״ירושלים של זהב״?", a: ["נעמי שמר", "אהוד מנור", "יהורם גאון", "רחל המשוררת"], c: 0 },
      /* ★ */ { q: "מהי העיר הגדולה בישראל במספר תושבים?", a: ["תל אביב", "ירושלים", "חיפה", "ראשון לציון"], c: 1 },
      /* ★ */ { q: "לבני כמה דתות מקודשת ירושלים?", a: ["אחת", "שתיים", "שלוש", "ארבע"], c: 2 },
      /* ★ */ { q: "מה מספרו של הכביש הראשי המוביל ממרכז הארץ לירושלים?", a: ["כביש 1", "כביש 6", "כביש 4", "כביש 40"], c: 0 },
      /* ★ */ { q: "לאיזה כיוון פונים המתפללים היהודים בתפילה?", a: ["לכיוון ירושלים", "לכיוון צפון", "לכיוון הים", "לכיוון מערב"], c: 0 },
      /* ★ */ { q: "אילו שתי קבוצות הספורט הירושלמיות הן המוכרות ביותר?", a: ["בית״ר והפועל ירושלים", "מכבי וצפרירים", "הכוח והשחר", "אליצור ואיחוד"], c: 0 },
      /* ★ */ { q: "איזה אירוע המוני נערך בירושלים מדי שנה בחול המועד סוכות?", a: ["מצעד ירושלים", "מרתון ירושלים", "פסטיבל האור", "יריד המזרח"], c: 0 },
      /* ★ */ { q: "בין אילו שני ימים שוכנת ירושלים?", a: ["הים התיכון וים המלח", "הים התיכון וים סוף", "ים המלח והכנרת", "ים סוף והכנרת"], c: 0 },
      /* ★ */ { q: "מהו הר המוריה?", a: ["ההר שבו נעקד יצחק ועליו נבנה בית המקדש", "ההר שעליו ניתנה התורה", "ההר שממערב לעיר העתיקה", "הר הזיתים"], c: 0 }
    ],
    medium: [

function fail(m){$("err").textContent=m||""}

function buildDeck(){
  var e=shuffle(BANK.easy),m=shuffle(BANK.medium),h=shuffle(BANK.hard);
  var ne=Math.ceil(ROUND*0.4),nm=Math.ceil(ROUND*0.4),nh=ROUND-ne-nm;
  deck=e.slice(0,ne).concat(m.slice(0,nm),h.slice(0,nh));
}

var OFFLINE_MS=5000;
function isOn(st,p){return (st.now-(p.seen||0))<OFFLINE_MS}
function onlineCount(st){var n=0;(st.players||[]).forEach(function(p){if(isOn(st,p))n++});return n}
function show(id){["s-lobby","s-q","s-board"].forEach(function(s){$(s).classList.toggle("on",s===id)})}

function btn(label,fn,ghost){
  var b=document.createElement("button");
  b.className="btn"+(ghost?" ghost":"");b.textContent=label;
  b.addEventListener("click",fn);return b;
}
function setControls(){
  var c=$("controls");c.innerHTML="";
  if(phase==="lobby"){
    c.appendChild(btn("התחלת המשחק",start));
    c.appendChild(btn("איפוס",reset,true));
  } else if(phase==="ask"){
    c.appendChild(btn("חשיפת התשובה",reveal));
    c.appendChild(btn("סיום המשחק",endNow,true));
  } else if(phase==="reveal"){
    c.appendChild(btn(idx+1>=deck.length?"סיום והצגת המנצח":"השאלה הבאה",next));
    c.appendChild(btn("סיום המשחק",endNow,true));
  } else if(phase==="end"){
    c.appendChild(btn("משחק חדש",reset));
  }
}

function reset(){
  buildDeck();idx=-1;phase="lobby";sigB="";sigC="";
  api("a=host",{cmd:"reset"}).then(function(){show("s-lobby");setControls()}).catch(function(){fail("אין קשר לשרת")});
}
function start(){
  ROUND=Number($("setRound").value)||15;
  SECONDS=Number($("setSecs").value)||25;
  buildDeck();
  idx=-1; next();
}
function endNow(){
  phase="end";clearInterval(tick);
  api("a=host",{cmd:"end"}).then(function(st){paintBoard(st,true);show("s-board");setControls()});
}

function next(){
  idx++;
  if(idx>=deck.length){
    phase="end";
    api("a=host",{cmd:"end"}).then(function(st){paintBoard(st,true);show("s-board");setControls()});
    return;
  }
  var q=deck[idx],order=shuffle([0,1,2,3]);
  var payload={cmd:"ask",idx:idx,total:deck.length,seconds:SECONDS,
    q:q.q,a:order.map(function(o){return q.a[o]}),c:order.indexOf(q.c)};
  phase="ask";lastCounts=null;sigB="";
  api("a=host",payload).then(function(st){
    paintQuestion(payload,st);show("s-q");setControls();
  }).catch(function(){fail("שליחת השאלה נכשלה")});
}
function reveal(){
  if(phase!=="ask")return;
  phase="reveal";clearInterval(tick);
  api("a=host",{cmd:"reveal"}).then(function(st){
    paintReveal(st);setControls();
    setTimeout(function(){ if(phase==="reveal"){paintBoard(st,false);show("s-board")} },3500);
  });
}

var cur=null;
function paintQuestion(p,st){
  cur=p;
  $("qtext").textContent=p.q;
  $("qi").textContent=p.idx+1;$("qn").textContent=p.total;
  var box=$("opts");box.className="opts";box.innerHTML="";
  p.a.forEach(function(txt,i){
    var d=document.createElement("div");d.className="opt";d.dataset.i=i;
    d.innerHTML='<span class="fill"></span><span class="tag">'+LETTERS[i]+'</span><span class="t">'+esc(txt)+'</span><span class="n"></span>';
    box.appendChild(d);
  });
  $("answered").textContent="0";
  $("ptotal").textContent=(st?onlineCount(st):0);
  startClock(st.endsAt);
}
function startClock(endsAt){
  clearInterval(tick);
  var upd=function(){
    var left=Math.max(0,Math.round((endsAt-(Date.now()+skew))/1000));
    $("tnum").textContent=left;
    $("trackbar").style.width=(left/SECONDS*100)+"%";
    var w=left<=5;
    $("track").classList.toggle("warn",w);
    $("timerbig").classList.toggle("warn",w);
    if(left<=0){clearInterval(tick); if(phase==="ask") reveal();}
  };
  upd();
  tick=setInterval(upd,250);
}
function paintReveal(st){
  clearInterval(tick);
  var box=$("opts");box.classList.add("revealed");
  var total=(st.counts||[]).reduce(function(a,b){return a+b},0)||1;
  [].forEach.call(box.children,function(d){
    var i=Number(d.dataset.i),n=(st.counts&&st.counts[i])||0;
    d.querySelector(".n").textContent=n;
    d.querySelector(".fill").style.width=(n/total*100)+"%";
    if(i===cur.c)d.classList.add("right");else d.classList.add("dim");
  });
}
var sigB="",sigC="",sigM="";
function paintBoard(st,final){
  var rows=(st.players||[]).slice().sort(function(a,b){return b.score-a.score});
  var sig=final+"|"+rows.map(function(r){return r.name+":"+r.score+":"+r.gain+":"+(isOn(st,r)?1:0)}).join("|");
  if(sig===sigB)return; sigB=sig;
  $("btitle").textContent=final?"המנצחים":"הניקוד עד כה";
  $("board").innerHTML=rows.slice(0,12).map(function(r,i){
    var off=!isOn(st,r);
    return '<li class="'+(off?"off":"")+'"><span class="r'+(i<3?" m"+(i+1):"")+'">'+(i+1)+'</span>'+
           '<span class="nm">'+esc(r.name)+'</span>'+
           (off?'<span class="off-tag">מנותק</span>':'')+
           '<span class="gain">'+(r.gain?"+"+r.gain:"")+'</span>'+
           '<span class="pt">'+r.score+'</span></li>';
  }).join("");
}

function paintLobby(st){
  var ps=st.players||[];
  var sig=ps.map(function(p){return p.name+(isOn(st,p)?"1":"0")}).join("|");
  if(sig===sigC)return; sigC=sig;
  $("chips").innerHTML=ps.map(function(p){
    return '<span class="chip'+(isOn(st,p)?"":" off")+'">'+esc(p.name)+'</span>'}).join("");
  var on=onlineCount(st);
  $("lcount").textContent=on?on+" שחקנים מחוברים":"מחכים לשחקנים…";
}

function loop(){
  api("a=state").then(function(st){
    fail("");
    skew=st.now-Date.now();
    var off=(st.players||[]).length-onlineCount(st);
    var mt=onlineCount(st)+" שחקנים"+(off>0?" · "+off+" מנותקים":"");
    if(mt!==sigM){sigM=mt;$("meta").textContent=mt}
    if(phase==="lobby")paintLobby(st);
    else if(phase==="ask"){
      var on=onlineCount(st);
      var an=String(st.answered||0),pt=String(on);
      if($("answered").textContent!==an)$("answered").textContent=an;
      if($("ptotal").textContent!==pt)$("ptotal").textContent=pt;
      if(on&&(st.answered||0)>=on)reveal();
    }
    else if(phase==="reveal"&&$("s-board").classList.contains("on"))paintBoard(st,false);
  }).catch(function(){fail("אין קשר לשרת — בודקים שוב")});
}

/* init */
var pu=PLAYER_URL||location.href.replace(/[^\/]*$/,"play.html");
$("joinurl").textContent=pu.replace(/^https?:\/\//,"");
try{ new QRCode($("qr"),{text:pu,width:190,height:190,correctLevel:QRCode.CorrectLevel.M}); }
catch(e){ $("qr").style.display="none"; }

if(!LIVE_URL){ fail("חסרה כתובת ה-Worker בשורת LIVE_URL"); }
buildDeck();setControls();
loop();poll=setInterval(loop,1200);
})();
</script>
